worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;
        # Redirect with relative Location headers; the public host/port is set by the front proxy
        absolute_redirect off;

        location = / {
            return 302 /validation/;
        }

        # Static Quarto dashboard (relative asset paths need the trailing slash)
        location = /validation {
            return 301 /validation/;
        }
        location /validation/ {
            root /usr/share/nginx/html;
            index index.html;
        }

        # NiceGUI dashboard
        location = /collective-impact {
            return 301 /collective-impact/;
        }
        location /collective-impact/ {
            proxy_pass http://127.0.0.1:8888/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /collective-impact;
            proxy_read_timeout 3600s;
            proxy_buffers 16 32k;
            proxy_buffer_size 32k;
        }
    }
}
