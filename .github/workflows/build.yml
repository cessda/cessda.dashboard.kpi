name: CI Build
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
      - name: Smoke test
        if: github.event_name != 'push'
        run: |
          docker run -d --name kpi -p 8080:80 "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/collective-impact/ && break
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:8080/validation/
          curl -fsS -o /dev/null http://localhost:8080/collective-impact/
          docker logs kpi
